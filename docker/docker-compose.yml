version: "3.9"

services:
  observa:
    image: observa:local
    build:
      context: ../observa
    container_name: observa
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: antipatterns
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: antipatterns
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d antipatterns"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
